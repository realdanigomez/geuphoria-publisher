name: Cron Safety Net

# Runs every 5 minutes to catch any GH Actions cron that didn't fire on
# schedule. The scheduler.py script computes current AST time, reads
# published_log.json, and fires any workflow whose scheduled slot has
# passed (+5 min grace) without a log entry. Idempotent — publish scripts
# self-check the log and skip duplicates.
#
# MULTI-TRIGGER DESIGN (codified 2026-05-04 after GH cron skipped doc-ep3;
# external trigger added 2026-09-01 after Railway went away):
# GH Actions cron is fundamentally unreliable — 2-4h delays, sometimes never
# fires. This safety net is itself a GH cron, so it can also be skipped.
# To break the dependency, we trigger the safety net from MULTIPLE sources:
#
#   1. schedule (*/5) — primary, but unreliable
#   2. workflow_dispatch — manual fallback
#   3. push to main paths [published_log.json] — fires every time a publish
#      workflow successfully commits the log. Creates a chain reaction: each
#      successful publish → safety net → checks next slot → fires if overdue.
#   4. push to main paths [heartbeat.json] — fires when the 7:45 UTC morning
#      heartbeat workflow pushes. Keeps crons alive daily.
#   5. workflow_run on ALL publish workflows — fires immediately after any
#      publish workflow completes. This is the most reliable chain trigger.
#   6. repository_dispatch (event_type: external-heartbeat) — an external,
#      GitHub-independent cron service (cron-job.org, free tier) POSTs to
#      /repos/.../dispatches every 5 minutes. This is the ONLY trigger source
#      here that doesn't depend on GitHub's own scheduler at all — it exists
#      because sources 1-5 ALL failed to fire for a ~17-minute window on
#      2026-09-01 (GH's native */5 schedule went quiet with nothing else
#      happening to kick the chain), missing that day's noon carousel. Setup:
#      _system/repos/cloud_publisher/EXTERNAL-CRON-SETUP.md.
#
# Together these 6 sources mean: even if every GitHub-side trigger fails at
# once, the external ping still wakes this workflow within 5 minutes,
# independent of GitHub's own infrastructure.
#
# Idempotency: the underlying publish scripts check published_log.json
# themselves and skip if the slot is already published for today, so
# firing this script multiple times per minute is safe.

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes UTC
  workflow_dispatch:
  repository_dispatch:
    types: [external-heartbeat]
  push:
    branches: [main]
    paths:
      - 'published_log.json'
      - 'heartbeat.json'
  workflow_run:
    workflows:
      - "Publish Reel — 8AM AST"
      - "Publish YT Short (Reel) — 8AM AST daily"
      - "Publish Carousel — 12PM AST"
      - "Notify YT Carousel Manual Upload — 12:01PM AST"
      - "Publish Doc Clip — 2PM AST daily"
      - "Publish Longform Clip — 3PM AST daily"
      - "Publish Longform Clip Bonus — 3:30PM AST daily"
      - "Publish Story — 7PM AST daily"
    types: [completed]

permissions:
  contents: read
  actions: write   # to fire other workflows via `gh workflow run`

jobs:
  safety-net:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: safety-net
      cancel-in-progress: false   # don't cancel; let each tick complete

    steps:
      # Sparse + blobless checkout — scheduler.py only ever reads scheduler.py,
      # published_log.json, and pending_longforms.json. Fixed 2026-09-01: a plain
      # checkout of the whole repo (now ~4GB of reel/clip/carousel/story video)
      # took ~3 minutes on `git fetch` alone and blew the old 3-minute timeout,
      # cancelling the job before scheduler.py ever ran — the safety net had
      # silently stopped catching missed crons since the go-live media push.
      # `filter: blob:none` skips downloading blob contents up front (only commit/
      # tree objects), and `sparse-checkout` limits what's actually materialized,
      # so this job's checkout stays fast regardless of how large the repo grows.
      - name: Checkout (sparse, blobless)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scheduler.py
            published_log.json
            pending_longforms.json
            mirror_schedule.json
            mirror_log.json
          sparse-checkout-cone-mode: false

      - name: Sync latest published_log.json
        run: |
          set -euo pipefail
          git fetch origin main
          # FETCH_HEAD is set directly by this fetch, unconditionally — unlike
          # origin/main, which depends on the remote's configured fetch refspec
          # actually mapping to refs/remotes/origin/main. actions/checkout@v4's
          # shallow, single-branch checkout doesn't reliably set that up, so a
          # `git show origin/main:...` right after `git fetch origin main` can
          # silently read a STALE pre-fetch blob if the tracking ref never
          # moved. FETCH_HEAD has no such ambiguity.
          git show FETCH_HEAD:published_log.json > published_log.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scheduler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scheduler.py

      # Mirror accounts (2026-11-09): GitHub's own */15 cron on publish-mirror.yml fires only a few times a day
      # (LinkedIn's identical cron: gaps of 8 to 11 h), so a post would land hours off its random time or go stale.
      # This net runs every 5 min off the external heartbeat: start the mirror job whenever a mirror post is due.
      - name: Start the mirror job when a mirror post is due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git show FETCH_HEAD:mirror_log.json > mirror_log.json 2>/dev/null || echo '{}' > mirror_log.json
          python - <<'EOF'
          import datetime as dt, json, os, subprocess
          tz = dt.timezone(dt.timedelta(hours=-4))
          now = dt.datetime.now(tz)
          sched = json.load(open("mirror_schedule.json")) if os.path.exists("mirror_schedule.json") else []
          log = json.load(open("mirror_log.json"))
          due = [e["key"] for e in sched
                 if log.get(e["key"], {}).get("status") not in ("posted", "stale", "gave_up")
                 and dt.timedelta(0) <= now - dt.datetime.strptime(e["at_ast"], "%Y-%m-%d %H:%M").replace(tzinfo=tz) <= dt.timedelta(hours=6)]
          if not due:
              print("no mirror post due"); raise SystemExit
          busy = subprocess.run(["gh", "run", "list", "--workflow", "publish-mirror.yml", "--json", "status",
                                 "--jq", '[.[] | select(.status != "completed")] | length'], capture_output=True, text=True).stdout.strip()
          if busy not in ("", "0"):
              print("mirror job already running/queued; due:", due); raise SystemExit
          print("due:", due)
          subprocess.run(["gh", "workflow", "run", "publish-mirror.yml"], check=True)
          EOF
