name: Trigger Documentary Ep 3 — May 4 6PM AST one-time

# One-shot: publishes Documentary Episode 3 (346MB) on YT.
# Cron restricted to May 4 only (`0 22 4 5 *` = 6PM AST, May 4).
# Resumable upload in 8MB chunks — typical run ~3-5 minutes.

on:
  schedule:
    - cron: '0 22 4 5 *'  # 22:00 UTC = 6PM AST, May 4 only
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # large upload
    steps:
      - name: Hit Railway /trigger/yt-longform?which=doc-ep3
        env:
          RAILWAY_PUBLISHER_URL: ${{ secrets.RAILWAY_PUBLISHER_URL }}
          RAILWAY_PUBLISHER_TOKEN: ${{ secrets.RAILWAY_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS --max-time 1800 -X POST \
            -H "Authorization: Bearer $RAILWAY_PUBLISHER_TOKEN" \
            "$RAILWAY_PUBLISHER_URL/trigger/yt-longform?which=doc-ep3")
          echo "Response:"
          echo "$response" | jq . || echo "$response"
