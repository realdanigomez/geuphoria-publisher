name: Publish Longform Clip — May 4 7:30PM AST

# One-shot longform-clip publish on May 4 only.
# Cron 23:30 UTC = 7:30 PM AST. Gated on yt_burnout_longform success (3PM AST publish).
# Publishes the IG reel + YT Short for hook-200-174.
# Auto-triggers Story reshare via the existing story-reshare.yml on workflow_run.

on:
  schedule:
    - cron: '30 23 4 5 *'   # 23:30 UTC = 7:30 PM AST, May 4 only
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without publishing (dry-run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout (with latest log)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync latest published_log.json
        run: git pull --ff-only origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib requests

      - name: Decode Google OAuth token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_TOKEN_JSON:-}" ]; then
            echo "::error::Missing GOOGLE_TOKEN_JSON secret"
            exit 1
          fi
          echo "$GOOGLE_TOKEN_JSON" | base64 -d > .google_token.json

      - name: Publish longform-clip (IG + YT Short, gated on yt_burnout_longform)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python publish_clip.py --slot longform_clip --platform both --gate yt_burnout_longform --dry-run
          else
            python publish_clip.py --slot longform_clip --platform both --gate yt_burnout_longform
          fi

      - name: Save published log + push (retry on conflict)
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          WORKFLOW_NAME: longform-clip-may4
        run: |
          set -euo pipefail
          git config user.email "bot@geuphoria.com"
          git config user.name "Geuphoria Publisher"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git add published_log.json
            git diff --staged --quiet && { echo "Nothing to commit."; break; }
            git commit -m "log: $WORKFLOW_NAME $(date -u +%Y-%m-%dT%H:%MZ)" || true
            if git push origin main; then
              echo "Pushed."
              break
            fi
            echo "Push failed, retrying in 5s..."
            sleep 5
          done

      - name: Cleanup token
        if: always()
        run: rm -f .google_token.json
