name: Publish YT Short (Reel #2) — 5PM AST

# 2nd daily YT Short for the reel_2 slot (2x weeks). Cron 0 21 * * * = 21:00 UTC = 5PM AST.
# Reads publish_schedule.json[<today AST>].reel_2 (yt side). No-op (exit 0) if absent.
# Runs in parallel to publish-reel-2.yml (IG side).

on:
  workflow_dispatch:   # fired by cron-safety-net on 2x-week dates (scheduler.py)
    inputs:
      dry_run:
        description: 'Run without publishing (dry-run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: publish-yt-reel-2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout (with latest log)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync latest published_log.json
        run: |
          set -euo pipefail
          git fetch origin main
          # FETCH_HEAD is set directly by this fetch, unconditionally — unlike
          # origin/main, which depends on the remote's configured fetch refspec
          # actually mapping to refs/remotes/origin/main. actions/checkout@v4's
          # shallow, single-branch checkout doesn't reliably set that up, so a
          # `git show origin/main:...` right after `git fetch origin main` can
          # silently read a STALE pre-fetch blob if the tracking ref never
          # moved. FETCH_HEAD has no such ambiguity.
          git show FETCH_HEAD:published_log.json > published_log.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib requests

      - name: Decode Google OAuth token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_TOKEN_JSON:-}" ]; then
            echo "::error::Missing GOOGLE_TOKEN_JSON secret"
            exit 1
          fi
          echo "$GOOGLE_TOKEN_JSON" | base64 -d > .google_token.json

      - name: Check today has a reel_2 slot with yt_cdn_url
        id: gate
        run: |
          set -euo pipefail
          today=$(TZ=America/Curacao date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          present=$(python -c "
          import json
          d = json.load(open('publish_schedule.json'))
          slot = d.get('$today', {}).get('reel_2', {})
          print('yes' if slot.get('yt_cdn_url') and slot.get('yt_caption_path') else 'no')
          ")
          echo "slot_present=$present" >> "$GITHUB_OUTPUT"
          echo "Today AST = $today / reel_2 YT slot = $present"

      - name: Publish reel_2 YT Short
        if: steps.gate.outputs.slot_present == 'yes'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python publish_clip.py --slot reel_2 --platform yt --dry-run
          else
            python publish_clip.py --slot reel_2 --platform yt
          fi

      - name: Save published log + push (retry on conflict)
        if: always() && steps.gate.outputs.slot_present == 'yes' && github.event.inputs.dry_run != 'true'
        env:
          WORKFLOW_NAME: yt-reel-2-daily
        run: |
          set -euo pipefail
          git config user.email "bot@geuphoria.com"
          git config user.name "Geuphoria Publisher"
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            python merge_published_log.py published_log.json
            git add published_log.json
            git diff --staged --quiet && { echo "Nothing to commit."; break; }
            git commit -m "log: $WORKFLOW_NAME $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin main; then
              echo "Pushed."
              break
            fi
            echo "Push failed, retrying in 5s..."
            git reset --soft HEAD~1
            sleep 5
          done

      - name: Cleanup token
        if: always()
        run: rm -f .google_token.json
