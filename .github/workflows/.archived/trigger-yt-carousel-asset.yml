name: Trigger YT Carousel Asset — 12PM AST

# Renders today's YT carousel hero image (1080x1920 single image) into
# the worker's volume + queues a phone notification with the upload link.
# Channel <500 subs so YT Community Posts API isn't available — Dani
# uploads manually within the day.

on:
  schedule:
    # 12PM AST = 16:00 UTC (same minute as carousel publish)
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hit Railway /trigger/yt-carousel-asset
        env:
          RAILWAY_PUBLISHER_URL: ${{ secrets.RAILWAY_PUBLISHER_URL }}
          RAILWAY_PUBLISHER_TOKEN: ${{ secrets.RAILWAY_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_PUBLISHER_TOKEN" \
            "$RAILWAY_PUBLISHER_URL/trigger/yt-carousel-asset")
          echo "Response:"
          echo "$response" | jq . || echo "$response"
