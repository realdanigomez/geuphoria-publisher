name: Trigger Burnout Longform — May 4 3PM AST one-time

# One-shot: publishes the Burnout/Client-Filter Longform on YT.
# Cron is restricted to May 4 only (`0 19 4 5 *` = 3PM AST, May 4).
# Manual workflow_dispatch is also enabled in case it needs a re-run.

on:
  schedule:
    - cron: '0 19 4 5 *'  # 19:00 UTC = 3PM AST, May 4 only
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hit Railway /trigger/yt-longform?which=burnout
        env:
          RAILWAY_PUBLISHER_URL: ${{ secrets.RAILWAY_PUBLISHER_URL }}
          RAILWAY_PUBLISHER_TOKEN: ${{ secrets.RAILWAY_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_PUBLISHER_TOKEN" \
            "$RAILWAY_PUBLISHER_URL/trigger/yt-longform?which=burnout")
          echo "Response:"
          echo "$response" | jq . || echo "$response"
