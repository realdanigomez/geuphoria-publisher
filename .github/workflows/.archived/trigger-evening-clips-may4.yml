name: Trigger Evening Clips — May 4 only

# May 4 launch day reshapes the schedule: source longforms (Burnout 3PM,
# Doc Ep 3 6PM) must publish FIRST, then their clips fire afterwards.
# This workflow runs the doc-clip at 6:30 PM AST and longform-clip at 7:30 PM AST,
# but only on May 4. Each job pre-checks that the source video has succeeded
# in published_log via the worker's /trigger endpoint (the worker itself
# does the gating).

on:
  schedule:
    - cron: '30 22 4 5 *'  # 22:30 UTC = 6:30 PM AST, May 4 — doc-clip
    - cron: '30 23 4 5 *'  # 23:30 UTC = 7:30 PM AST, May 4 — longform-clip
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot (manual override)'
        required: false
        default: 'doc-clip'
        type: choice
        options:
          - doc-clip
          - longform-clip

jobs:
  resolve-slot:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.pick.outputs.slot }}
    steps:
      - id: pick
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            slot="$INPUT_SLOT"
          else
            case "$SCHED" in
              "30 22 4 5 *") slot="doc-clip" ;;
              "30 23 4 5 *") slot="longform-clip" ;;
              *) echo "Unknown cron: $SCHED"; exit 1 ;;
            esac
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Resolved slot: $slot"

  ig:
    runs-on: ubuntu-latest
    needs: resolve-slot
    timeout-minutes: 15
    steps:
      - name: Hit Railway /trigger/reel?slot=<doc-clip|longform-clip>
        env:
          RAILWAY_PUBLISHER_URL: ${{ secrets.RAILWAY_PUBLISHER_URL }}
          RAILWAY_PUBLISHER_TOKEN: ${{ secrets.RAILWAY_PUBLISHER_TOKEN }}
          SLOT: ${{ needs.resolve-slot.outputs.slot }}
        run: |
          set -euo pipefail
          # The worker checks published_log for the source video's success row
          # before publishing. If gating fails, it returns status:noop or error;
          # we surface that here so the Action visibly reports it.
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_PUBLISHER_TOKEN" \
            "$RAILWAY_PUBLISHER_URL/trigger/reel?slot=$SLOT")
          echo "IG Response:"
          echo "$response" | jq . || echo "$response"

  yt:
    runs-on: ubuntu-latest
    needs: [resolve-slot, ig]
    if: ${{ success() }}
    timeout-minutes: 30
    steps:
      - name: Hit Railway /trigger/yt-shorts?slot=<doc-clip|longform-clip>
        env:
          RAILWAY_PUBLISHER_URL: ${{ secrets.RAILWAY_PUBLISHER_URL }}
          RAILWAY_PUBLISHER_TOKEN: ${{ secrets.RAILWAY_PUBLISHER_TOKEN }}
          SLOT: ${{ needs.resolve-slot.outputs.slot }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_PUBLISHER_TOKEN" \
            "$RAILWAY_PUBLISHER_URL/trigger/yt-shorts?slot=$SLOT")
          echo "YT Response:"
          echo "$response" | jq . || echo "$response"
