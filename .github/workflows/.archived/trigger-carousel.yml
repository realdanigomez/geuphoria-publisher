name: Trigger Carousel — 12PM AST

# Fires the daily IG carousel. Worker auto-publishes carousel + Story reshare
# of slide-1 + enqueues a carousel-music phone notification (24h music window).

on:
  schedule:
    # 12PM AST = 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hit Railway /trigger/carousel
        env:
          RAILWAY_PUBLISHER_URL: ${{ secrets.RAILWAY_PUBLISHER_URL }}
          RAILWAY_PUBLISHER_TOKEN: ${{ secrets.RAILWAY_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          echo "POST $RAILWAY_PUBLISHER_URL/trigger/carousel"
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_PUBLISHER_TOKEN" \
            "$RAILWAY_PUBLISHER_URL/trigger/carousel")
          echo "Response:"
          echo "$response" | jq . || echo "$response"
