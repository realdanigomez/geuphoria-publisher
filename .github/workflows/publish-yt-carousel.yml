name: Publish YT Carousel Short — 12PM AST daily
# NOTE: YT carousels are posted MANUALLY via YouTube Studio Community Posts.
# This workflow is kept for reference / future use but does NOT auto-trigger.

on:
  workflow_dispatch:

concurrency:
  group: publish-yt-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout (with latest log)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync latest published_log.json
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:published_log.json > published_log.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg

      - name: Decode Google OAuth token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_TOKEN_JSON:-}" ]; then
            echo "::error::Missing GOOGLE_TOKEN_JSON secret"
            exit 1
          fi
          echo "$GOOGLE_TOKEN_JSON" | base64 -d > .google_token.json

      - name: Publish YT Carousel Short
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish_yt_carousel.py

      - name: Save published log + push (retry on conflict)
        if: always()
        env:
          WORKFLOW_NAME: publish-yt-carousel
        run: |
          set -euo pipefail
          git config user.email "bot@geuphoria.com"
          git config user.name "Geuphoria Publisher"
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            python merge_published_log.py published_log.json
            git add published_log.json
            git diff --staged --quiet && { echo "Nothing to commit."; break; }
            git commit -m "log: $WORKFLOW_NAME $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin main; then
              echo "Pushed."
              break
            fi
            echo "Push failed, retrying in 5s..."
            git reset --soft HEAD~1
            sleep 5
          done

      - name: Cleanup token
        if: always()
        run: rm -f .google_token.json
