name: Publish Story #2 — 11AM AST

# 2nd daily story for 2x split-test weeks. Cron 0 15 * * * = 15:00 UTC = 11AM AST.
# Reads publish_schedule.json[<today AST>].story_2 (via --slot story_2). No-op if absent.

on:
  workflow_dispatch:   # fired by cron-safety-net on 2x-week dates (scheduler.py)
    inputs:
      dry_run:
        description: 'Run without publishing (dry-run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: publish-story-2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout (with latest log)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync latest published_log.json
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:published_log.json > published_log.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check today has a story_2 slot
        id: gate
        run: |
          set -euo pipefail
          today=$(TZ=America/Curacao date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          slot=$(python -c "import json; d=json.load(open('publish_schedule.json')); print('yes' if 'story_2' in d.get('$today',{}) else 'no')")
          echo "slot_present=$slot" >> "$GITHUB_OUTPUT"
          echo "Today AST = $today / story_2 slot = $slot"

      - name: Publish story_2 sequence
        if: steps.gate.outputs.slot_present == 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python publish_story.py --slot story_2 --dry-run
          else
            python publish_story.py --slot story_2
          fi

      - name: Save published log + push (retry on conflict)
        if: always() && steps.gate.outputs.slot_present == 'yes' && github.event.inputs.dry_run != 'true'
        env:
          WORKFLOW_NAME: story-2-daily
        run: |
          set -euo pipefail
          git config user.email "bot@geuphoria.com"
          git config user.name "Geuphoria Publisher"
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            python merge_published_log.py published_log.json
            git add published_log.json
            git diff --staged --quiet && { echo "Nothing to commit."; break; }
            git commit -m "log: $WORKFLOW_NAME $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin main; then
              echo "Pushed."
              break
            fi
            echo "Push failed, retrying in 5s..."
            git reset --soft HEAD~1
            sleep 5
          done
