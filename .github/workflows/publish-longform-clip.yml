name: Publish Longform Clip — 3PM AST daily

# Daily longform-clip publish (Tue–Sun May 5–10).
# Cron 0 19 * * * = 19:00 UTC = 3PM AST.
# Reads publish_schedule.json[<today AST>].longform_clip and publishes IG + YT Short.
# Auto-triggers Story reshare via story-reshare.yml on workflow_run.
# If no longform_clip slot for today (e.g. May 11+), the script exits 0 with a notice.

on:
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC = 3PM AST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without publishing (dry-run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout (with latest log)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync latest published_log.json
        run: git pull --ff-only origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib requests

      - name: Decode Google OAuth token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_TOKEN_JSON:-}" ]; then
            echo "::error::Missing GOOGLE_TOKEN_JSON secret"
            exit 1
          fi
          echo "$GOOGLE_TOKEN_JSON" | base64 -d > .google_token.json

      - name: Check today has a longform_clip slot
        id: gate
        run: |
          set -euo pipefail
          today=$(TZ=America/Curacao date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          slot=$(python -c "import json,sys; d=json.load(open('publish_schedule.json')); print('yes' if 'longform_clip' in d.get('$today',{}) else 'no')")
          echo "slot_present=$slot" >> "$GITHUB_OUTPUT"
          echo "Today AST = $today / longform_clip slot = $slot"

      - name: Publish longform-clip (IG + YT Short)
        if: steps.gate.outputs.slot_present == 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python publish_clip.py --slot longform_clip --platform both --dry-run
          else
            python publish_clip.py --slot longform_clip --platform both
          fi

      - name: Save published log + push (retry on conflict)
        if: always() && steps.gate.outputs.slot_present == 'yes' && github.event.inputs.dry_run != 'true'
        env:
          WORKFLOW_NAME: longform-clip-daily
        run: |
          set -euo pipefail
          git config user.email "bot@geuphoria.com"
          git config user.name "Geuphoria Publisher"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git add published_log.json
            git diff --staged --quiet && { echo "Nothing to commit."; break; }
            git commit -m "log: $WORKFLOW_NAME $(date -u +%Y-%m-%dT%H:%MZ)" || true
            if git push origin main; then
              echo "Pushed."
              break
            fi
            echo "Push failed, retrying in 5s..."
            sleep 5
          done

      - name: Cleanup token
        if: always()
        run: rm -f .google_token.json
