name: Publish Carousel — 12PM AST

on:
  schedule:
    # 12PM AST = 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: publish-carousel
  cancel-in-progress: false   # queue, never cancel — second run checks log and skips

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to commit published_log.json back

    steps:
      - name: Checkout (with latest log)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync latest published_log.json
        run: git pull --ff-only origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Publish Carousel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FREEIMAGE_KEY: ${{ secrets.FREEIMAGE_KEY }}
        run: python cloud_publish.py carousel

      - name: Save published log + push (retry on conflict)
        if: always()
        env:
          WORKFLOW_NAME: publish-carousel
        run: |
          set -euo pipefail
          git config user.email "bot@geuphoria.com"
          git config user.name "Geuphoria Publisher"
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            python merge_published_log.py published_log.json
            git add published_log.json
            git diff --staged --quiet && { echo "Nothing to commit."; break; }
            git commit -m "log: $WORKFLOW_NAME $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin main; then
              echo "Pushed."
              break
            fi
            echo "Push failed, retrying in 5s..."
            git reset --soft HEAD~1
            sleep 5
          done

      - name: Notify dashboard (carousel-music reminder)
        if: success()
        env:
          DASHBOARD_NOTIFY_URL: ${{ secrets.DASHBOARD_NOTIFY_URL }}
          DASHBOARD_NOTIFY_TOKEN: ${{ secrets.DASHBOARD_NOTIFY_TOKEN }}
        run: |
          set -e
          if [ -z "${DASHBOARD_NOTIFY_URL:-}" ] || [ -z "${DASHBOARD_NOTIFY_TOKEN:-}" ]; then
            echo "DASHBOARD_NOTIFY_* secrets not set; skipping notification (Railway deploy pending)"
            exit 0
          fi
          # Resolve today's carousel slug (AST = UTC-4)
          SLUG=$(python -c "import json; from datetime import datetime,timezone,timedelta; t=(datetime.now(timezone.utc)+timedelta(hours=-4)).strftime('%Y-%m-%d'); d=json.load(open('publish_schedule.json')); c=d.get(t,{}).get('carousel',{}); print(c.get('name') or '')")
          if [ -z "$SLUG" ]; then
            echo "No carousel scheduled for today — skipping notification."
            exit 0
          fi
          curl -fsS -X POST "${DASHBOARD_NOTIFY_URL%/}/api/notifications/enqueue" \
            -H "Authorization: Bearer $DASHBOARD_NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(python -c "import json,sys; print(json.dumps({'kind':'carousel_music','title':'Add music to ' + sys.argv[1] + ' carousel','body':'Open IG → tap edit on the post → attach trending music. 24h window.','priority':'normal'}))" "$SLUG")" \
            || echo "Dashboard notify failed (non-fatal)"
