name: Story Reshare

# Reshares the just-published feed post (reel/carousel) as an IG Story.
# Auto-fires after every successful publish-reel or publish-carousel run.
# Can also be fired manually via workflow_dispatch with a slot input.

on:
  workflow_run:
    workflows:
      - "Publish Reel — 8AM AST"
      - "Publish Carousel — 12PM AST"
      - "Publish Doc Clip — May 4 6:30PM AST"
      - "Publish Longform Clip — May 4 7:30PM AST"
      - "Publish Doc Clip — 2PM AST daily"
      - "Publish Longform Clip — 3PM AST daily"
    types:
      - completed
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to reshare (reel | carousel | doc_clip | longform_clip)"
        required: true
        default: "reel"
      media_id:
        description: "Override: explicit media_id (optional — defaults to today's logged ID)"
        required: false

# CRITICAL: workflow_run triggers default to read-only GITHUB_TOKEN.
# Without this block the log-push step fails with 403 even though the
# Story is already live on IG. Must be at workflow level.
permissions:
  contents: write

jobs:
  reshare:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
          else
            # Map workflow_run name to slot — order matters (longest match first)
            wf="${{ github.event.workflow_run.name }}"
            case "$wf" in
              *"Longform Clip"*) echo "slot=longform_clip" >> $GITHUB_OUTPUT ;;
              *"Doc Clip"*)      echo "slot=doc_clip"      >> $GITHUB_OUTPUT ;;
              *Reel*)            echo "slot=reel"          >> $GITHUB_OUTPUT ;;
              *Carousel*)        echo "slot=carousel"      >> $GITHUB_OUTPUT ;;
              *)                 echo "slot=reel"          >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Sync latest published_log.json
        run: git pull --ff-only origin main || true

      - name: Reshare to Story
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.media_id }}" ]; then
            python story_reshare.py "${{ steps.slot.outputs.slot }}" --media-id "${{ inputs.media_id }}"
          else
            python story_reshare.py "${{ steps.slot.outputs.slot }}"
          fi

      - name: Save story log + push (retry on conflict)
        env:
          WORKFLOW_NAME: story-reshare
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          set -euo pipefail
          git config user.email "bot@geuphoria.com"
          git config user.name "Geuphoria Publisher"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git add published_log.json
            git diff --staged --quiet && { echo "Nothing to commit."; break; }
            git commit -m "log: $WORKFLOW_NAME $SLOT $(date -u +%Y-%m-%dT%H:%MZ)" || true
            if git push origin main; then
              echo "Pushed."
              break
            fi
            echo "Push failed, retrying in 5s..."
            sleep 5
          done
