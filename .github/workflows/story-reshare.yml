name: Story Reshare

# DISABLED auto-trigger as of 2026-05-04 — Dani prefers the IG mobile app's
# native "Share → Add to Story" sticker (which embeds the original post and
# is tappable) over a Graph API video re-upload. The Graph API does NOT
# support that sticker pattern; only fresh Story uploads. So this workflow
# stays available for manual workflow_dispatch (emergency / one-off use)
# but no longer fires automatically on each IG publish.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to reshare (reel | carousel | doc_clip | longform_clip)"
        required: true
        default: "reel"
      media_id:
        description: "Override: explicit media_id (optional — defaults to today's logged ID)"
        required: false

# CRITICAL: workflow_run triggers default to read-only GITHUB_TOKEN.
# Without this block the log-push step fails with 403 even though the
# Story is already live on IG. Must be at workflow level.
permissions:
  contents: write

jobs:
  reshare:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
          else
            # Map workflow_run name to slot — order matters (longest match first)
            wf="${{ github.event.workflow_run.name }}"
            case "$wf" in
              *"Longform Clip"*) echo "slot=longform_clip" >> $GITHUB_OUTPUT ;;
              *"Doc Clip"*)      echo "slot=doc_clip"      >> $GITHUB_OUTPUT ;;
              *Reel*)            echo "slot=reel"          >> $GITHUB_OUTPUT ;;
              *Carousel*)        echo "slot=carousel"      >> $GITHUB_OUTPUT ;;
              *)                 echo "slot=reel"          >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Sync latest published_log.json
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:published_log.json > published_log.json

      - name: Reshare to Story
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.media_id }}" ]; then
            python story_reshare.py "${{ steps.slot.outputs.slot }}" --media-id "${{ inputs.media_id }}"
          else
            python story_reshare.py "${{ steps.slot.outputs.slot }}"
          fi

      - name: Save story log + push (retry on conflict)
        env:
          WORKFLOW_NAME: story-reshare
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          set -euo pipefail
          git config user.email "bot@geuphoria.com"
          git config user.name "Geuphoria Publisher"
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            python merge_published_log.py published_log.json
            git add published_log.json
            git diff --staged --quiet && { echo "Nothing to commit."; break; }
            git commit -m "log: $WORKFLOW_NAME $SLOT $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin main; then
              echo "Pushed."
              break
            fi
            echo "Push failed, retrying in 5s..."
            git reset --soft HEAD~1
            sleep 5
          done
